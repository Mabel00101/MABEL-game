<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>MABEL幸运星第二版</title>

</head>
<body>
<div class="container">
<h1>⭐ MABEL游戏<br>之无敌幸运星</h1>

<div id="result" class="result hide">
<div class="god">☁️✨ 神仙降临 ✨☁️</div>

<p>今日忌：冲动消费、争执</p>
<p>幸运颜色：金色　幸运方位：东南</p>
</div>

<h2>☯ 卦象图鉴</h2>
<div class="cards">
<div>乾为天<br>★★★★★</div>
<div>水火既济<br>★★★★</div>
<div>震为雷<br>★★★</div>
</div>
</div>

</html>
